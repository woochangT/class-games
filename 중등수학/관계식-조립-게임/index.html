<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관계식 조립 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* 듀오링고식 한 화면 앱 3장: 설정 → 플레이(타임바·목표량·빈칸·타일·확인) → 결과 */
  --green: #58CC02; --green-dark: #58A700; --green-tint: #D7FFB8;
  --red: #FF4B4B; --red-dark: #EA2B2B; --red-tint: #FFDFE0;
  --amber: #FF9600; --blue: #1CB0F6; --blue-dark: #1899D6; --blue-tint: #DDF4FF; --blue-line: #84D8FF;
  --purple: #A560E8; --purple-tint: #F3E6FF;
  --ink: #3C3C3C; --muted: #777777; --faint: #AFAFAF; --line: #E5E5E5; --bg: #FFFFFF;
  --display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.app { height: 100%; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: 16px 16px 0; background: var(--bg); }
.screen.show { display: flex; }

/* 공통 버튼 */
.btn { width: 100%; min-height: 52px; border: 0; border-radius: 16px; font-size: 17px; font-weight: 800; letter-spacing: .04em; cursor: pointer;
  background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-dark); transition: transform .06s, box-shadow .06s; }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--green-dark); }
.btn:disabled { background: var(--line); color: var(--faint); box-shadow: 0 4px 0 #D0D0D0; cursor: default; transform: none; }
.btn.red { background: var(--red); box-shadow: 0 4px 0 var(--red-dark); }
.btn.ghost { background: #fff; color: var(--blue); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.ghost:active { box-shadow: 0 0 0 var(--line); }
.footer { margin: auto -16px 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); border-top: 2px solid var(--line); display: grid; gap: 14px; }
.footer.plain { border-top: 0; }

/* ── 설정 화면 ── */
.home-head { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.home-head .mascot { width: 76px; height: 76px; flex: none; }
.home-title { font-family: var(--display); font-size: 34px; line-height: 1.1; margin: 0; }
.home-sub { margin: 4px 0 0; color: var(--muted); font-weight: 700; font-size: 14px; }
.opts { margin-top: 24px; display: grid; gap: 22px; overflow-y: auto; padding-bottom: 8px; }
.opt h2 { margin: 0 0 10px; font-size: 16px; font-weight: 800; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chips.two { grid-template-columns: 1fr 1fr; }
.chips.five { grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chips.five .chip { font-size: 16px; padding: 6px 2px; }
.chip { min-height: 52px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: #fff; color: var(--ink);
  font-size: 17px; font-weight: 800; cursor: pointer; padding: 6px 8px; font-variant-numeric: tabular-nums; }
.chip small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.chip[aria-checked="true"] { background: var(--blue-tint); border-color: var(--blue-line); color: var(--blue-dark); }
.chip[aria-checked="true"] small { color: var(--blue-dark); }
.chip:active { transform: translateY(2px); border-bottom-width: 2px; }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); font-weight: 700; line-height: 1.6; }
.note b { color: var(--ink); }

/* ── 플레이 화면 ── */
.top { display: flex; align-items: center; gap: 12px; }
.icon-btn { width: 32px; height: 32px; border: 0; background: none; color: var(--faint); font-size: 26px; line-height: 1; cursor: pointer; padding: 0; border-radius: 8px; }
.timebar { flex: 1; height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; }
.timefill { height: 100%; width: 100%; background: var(--green); border-radius: 99px; position: relative; transition: background-color .3s; }
.timefill::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.3); }
.timefill.warn { background: var(--amber); }
.timefill.danger { background: var(--red); animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .65; } }
.counter { font-weight: 800; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.meta { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; min-height: 28px; }
.family { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 8px; }
.family.speed { color: var(--blue); background: var(--blue-tint); }
.family.salt { color: var(--purple); background: var(--purple-tint); }
.streak { font-size: 13px; font-weight: 800; color: var(--amber); opacity: 0; transition: opacity .2s; }
.streak.on { opacity: 1; }
.prompt { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.prompt .mascot { width: 60px; height: 60px; flex: none; }
.bubble { position: relative; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 15px; }
.bubble::before { content: ""; position: absolute; left: -10px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right-color: var(--line); border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -7px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-right-color: var(--bg); border-left: 0; }
.target { font-family: var(--display); font-size: clamp(40px, 13vw, 54px); line-height: 1.1; margin: 18px 0 0; font-weight: 400; }
.target .eq { color: var(--faint); margin-left: 6px; }
.answer { margin-top: 12px; min-height: 124px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px 6px; padding: 6px 0;
  background: repeating-linear-gradient(to bottom, transparent 0 57px, var(--line) 57px 59px); }
.answer.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.hint { color: var(--faint); font-weight: 700; font-size: 15px; padding: 14px 2px; }
.bank { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px; }
.tile { font-family: var(--body); font-weight: 700; font-size: 18px; color: var(--ink); background: #fff; border: 2px solid var(--line); border-bottom-width: 4px;
  border-radius: 12px; padding: 8px 14px; min-width: 48px; min-height: 49px; cursor: pointer; user-select: none; }
.tile.op { color: var(--blue); font-size: 22px; font-weight: 800; padding: 6px 14px; }
.tile.num { font-variant-numeric: tabular-nums; }
.tile:active { transform: translateY(2px); border-bottom-width: 2px; margin-top: 2px; }
.tile.used { background: var(--line); border-color: var(--line); color: transparent; cursor: default; pointer-events: none; }
.answer .tile { animation: pop .15s ease-out; }
@keyframes pop { from { transform: scale(.8); opacity: .3; } }
.locked .tile { pointer-events: none; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.9,.3,1.2); z-index: 2; }
.sheet.show { transform: translateY(0); }
.sheet.good { background: var(--green-tint); }
.sheet.bad { background: var(--red-tint); }
.sheet h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.sheet.good h2, .sheet.good p { color: var(--green-dark); }
.sheet.bad h2, .sheet.bad p { color: var(--red-dark); }
.badge { width: 32px; height: 32px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 20px; }
.sheet p { margin: 0 0 16px; font-weight: 700; font-size: 15px; line-height: 1.5; }

.modal { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; z-index: 5; }
.modal.show { display: flex; }
.modal-card { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 24px 16px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 14px; text-align: center; }
.modal-card h2 { margin: 0; font-size: 20px; font-weight: 800; }
.modal-card p { margin: 0 0 6px; color: var(--muted); font-weight: 700; }

/* ── 결과 화면 ── */
#end { align-items: center; text-align: center; padding-top: 32px; }
#end .mascot { width: 108px; height: 108px; flex: none; }
.score { font-family: var(--display); font-size: 60px; margin: 8px 0 0; color: var(--amber); font-variant-numeric: tabular-nums; line-height: 1; }
.score small { font-size: 28px; color: var(--faint); }
.taunt { font-family: var(--display); font-size: 23px; line-height: 1.4; margin: 16px 0 8px; max-width: 17em; text-wrap: balance; }
.fact { color: var(--muted); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.wrongs { width: 100%; margin-top: 18px; text-align: left; overflow-y: auto; flex: 1; min-height: 0; }
.wrongs h3 { margin: 0 0 8px; font-size: 14px; font-weight: 800; color: var(--muted); }
.wrongs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.wrongs li { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; line-height: 1.5; }
.wrongs li b { color: var(--red-dark); }
.wrongs .clean { color: var(--green-dark); font-weight: 800; text-align: center; padding: 12px; }
#end .footer { width: calc(100% + 32px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mascot-smug" viewBox="0 0 64 64">
      <g transform="rotate(-8 32 34)">
        <rect x="10" y="12" width="44" height="44" rx="9" fill="#F4F7FB" stroke="#C9D3DE" stroke-width="3"/>
        <path d="M18 16 L26 16 L20 24 Z" fill="#fff" opacity=".9"/>
        <ellipse cx="24" cy="34" rx="5" ry="5.5" fill="#3C3C3C"/><ellipse cx="40" cy="34" rx="5" ry="5.5" fill="#3C3C3C"/>
        <rect x="17" y="27" width="14" height="6" fill="#F4F7FB"/><rect x="33" y="27" width="14" height="6" fill="#F4F7FB"/>
        <path d="M18 29 H30 M34 29 H46" stroke="#3C3C3C" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M27 46 Q34 50 40 44" fill="none" stroke="#3C3C3C" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="18" cy="42" r="3" fill="#FFB3B3" opacity=".7"/><circle cx="46" cy="42" r="3" fill="#FFB3B3" opacity=".7"/>
      </g>
    </symbol>
    <symbol id="mascot-shock" viewBox="0 0 64 64">
      <g transform="rotate(4 32 34)">
        <rect x="10" y="12" width="44" height="44" rx="9" fill="#F4F7FB" stroke="#C9D3DE" stroke-width="3"/>
        <circle cx="24" cy="32" r="6" fill="#fff" stroke="#3C3C3C" stroke-width="2.5"/><circle cx="40" cy="32" r="6" fill="#fff" stroke="#3C3C3C" stroke-width="2.5"/>
        <circle cx="24" cy="32" r="2.5" fill="#3C3C3C"/><circle cx="40" cy="32" r="2.5" fill="#3C3C3C"/>
        <ellipse cx="32" cy="46" rx="4" ry="5" fill="#3C3C3C"/>
        <path d="M50 14 q3 5 0 8" fill="none" stroke="#7FC8F8" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </symbol>
    <symbol id="mascot-yawn" viewBox="0 0 64 64">
      <g transform="rotate(10 32 34)">
        <rect x="10" y="12" width="44" height="44" rx="9" fill="#F4F7FB" stroke="#C9D3DE" stroke-width="3"/>
        <path d="M18 33 Q24 37 30 33 M34 33 Q40 37 46 33" fill="none" stroke="#3C3C3C" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="32" cy="46" rx="6" ry="4" fill="#3C3C3C"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="app" id="app">

  <!-- 설정 -->
  <section class="screen show" id="home" aria-label="게임 설정">
    <div class="home-head">
      <svg class="mascot"><use href="#mascot-smug"/></svg>
      <div>
        <h1 class="home-title">관계식 조립</h1>
        <p class="home-sub">거리·빠르기·시간 / 소금물</p>
      </div>
    </div>
    <div class="opts">
      <div class="opt">
        <h2 id="lbl-count">문제 수</h2>
        <div class="chips" role="radiogroup" aria-labelledby="lbl-count" data-key="count">
          <button class="chip" role="radio" data-v="5">5</button>
          <button class="chip" role="radio" data-v="10">10</button>
          <button class="chip" role="radio" data-v="15">15</button>
          <button class="chip" role="radio" data-v="20">20</button>
        </div>
      </div>
      <div class="opt">
        <h2 id="lbl-limit">문제당 제한 시간</h2>
        <div class="chips five" role="radiogroup" aria-labelledby="lbl-limit" data-key="limit">
          <button class="chip" role="radio" data-v="5">5초</button>
          <button class="chip" role="radio" data-v="10">10초</button>
          <button class="chip" role="radio" data-v="15">15초</button>
          <button class="chip" role="radio" data-v="20">20초</button>
          <button class="chip" role="radio" data-v="30">30초</button>
        </div>
      </div>
      <div class="opt">
        <h2 id="lbl-salt">소금물 문제</h2>
        <div class="chips two" role="radiogroup" aria-labelledby="lbl-salt" data-key="salt">
          <button class="chip" role="radio" data-v="ratio">진하기만<small>소금 ÷ 소금물</small></button>
          <button class="chip" role="radio" data-v="mixed">진하기 + 농도<small>섞어서 출제</small></button>
        </div>
        <p class="note" id="saltNote"></p>
      </div>
    </div>
    <div class="footer plain">
      <button class="btn" id="start">게임 만들기</button>
    </div>
  </section>

  <!-- 플레이 -->
  <section class="screen" id="play" aria-label="문제 풀기">
    <div class="top">
      <button class="icon-btn" id="quit" aria-label="그만하기">×</button>
      <div class="timebar" role="progressbar" aria-label="남은 시간"><div class="timefill" id="timefill"></div></div>
      <div class="counter" id="counter">1/10</div>
    </div>
    <div class="meta">
      <span class="family speed" id="family">빠르기 계열</span>
      <span class="streak" id="streak">3연속!</span>
    </div>
    <div class="prompt">
      <svg class="mascot"><use href="#mascot-smug"/></svg>
      <div class="bubble" id="bubble">이거 구하는 식, 만들 수 있겠어?</div>
    </div>
    <h2 class="target" id="target"><span id="targetWord">걸린 시간</span><span class="eq">=</span></h2>
    <div class="answer" id="answer" aria-label="답 칸" aria-live="polite"></div>
    <div class="bank" id="bank" aria-label="타일"></div>
    <div class="footer">
      <button class="btn" id="check" disabled>확인</button>
    </div>
    <div class="sheet" id="sheet" role="status">
      <h2><span class="badge" id="sheetBadge">✓</span><span id="sheetText">정답!</span></h2>
      <p id="sheetBody"></p>
      <button class="btn" id="next">계속</button>
    </div>
    <div class="modal" id="quitModal" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
      <div class="modal-card">
        <h2 id="quitTitle">벌써 도망가게?</h2>
        <p>지금 나가면 이번 판 기록은 남지 않아.</p>
        <button class="btn" id="stay">계속 풀기</button>
        <button class="btn ghost" id="leave">그만하기</button>
      </div>
    </div>
  </section>

  <!-- 결과 -->
  <section class="screen" id="end" aria-label="결과">
    <svg class="mascot" id="endMascot"><use href="#mascot-smug"/></svg>
    <div class="score" id="score">0<small> / 10</small></div>
    <div class="taunt" id="taunt"></div>
    <div class="fact" id="fact"></div>
    <div class="wrongs" id="wrongs"></div>
    <div class="footer plain">
      <button class="btn" id="again">한 판 더</button>
      <button class="btn ghost" id="toHome">설정 바꾸기</button>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ── 문제 은행 ──
  // 진하기 = 소금의 양 ÷ 소금물의 양 (비율),  농도(%) = 소금의 양 ÷ 소금물의 양 × 100
  const SPEED = ['간 거리', '빠르기', '걸린 시간'];
  const PROBLEMS = [
    { id: 'd',  fam: 'speed', target: '간 거리',    given: ['빠르기', '걸린 시간'],     answer: '빠르기 × 걸린 시간' },
    { id: 'v',  fam: 'speed', target: '빠르기',     given: ['간 거리', '걸린 시간'],    answer: '간 거리 ÷ 걸린 시간' },
    { id: 't',  fam: 'speed', target: '걸린 시간',  given: ['간 거리', '빠르기'],       answer: '간 거리 ÷ 빠르기' },
    { id: 'r',  fam: 'ratio', target: '진하기',     given: ['소금의 양', '소금물의 양'], answer: '소금의 양 ÷ 소금물의 양' },
    { id: 'rs', fam: 'ratio', target: '소금의 양',  given: ['소금물의 양', '진하기'],    answer: '소금물의 양 × 진하기' },
    { id: 'rb', fam: 'ratio', target: '소금물의 양', given: ['소금의 양', '진하기'],     answer: '소금의 양 ÷ 진하기' },
    { id: 'p',  fam: 'pct',   target: '농도',       given: ['소금의 양', '소금물의 양'], answer: '소금의 양 ÷ 소금물의 양 × 100' },
    { id: 'ps', fam: 'pct',   target: '소금의 양',  given: ['소금물의 양', '농도'],      answer: '소금물의 양 × 농도 ÷ 100' },
    { id: 'pb', fam: 'pct',   target: '소금물의 양', given: ['소금의 양', '농도'],       answer: '소금의 양 ÷ 농도 × 100' }
  ];
  const FAM_LABEL = { speed: '빠르기 계열', ratio: '소금물 계열', pct: '소금물 계열' };
  const FAM_CLASS = { speed: 'speed', ratio: 'salt', pct: 'salt' };
  const STAT_LABEL = { speed: '빠르기', ratio: '진하기', pct: '농도' };

  const BUBBLES = ['이거 구하는 식, 만들 수 있겠어?', '설마 이것도 헷갈려?', '자, 나눌 거야 곱할 거야?', '천천히 해. 시간은 안 기다려 주지만.', '100은 넣을 거야 말 거야?'];
  // 정답 멘트: 걸린 시간에 따라 다르게 (빠름 → 무난 → 보통 → 아슬아슬)
  const RIGHT = {
    blitz: ['이렇게 빨리?', '벌써? 손이 눈보다 빠르네!', '와, 고민도 안 했지?'],
    quick: ['오호, 좀 하는군.', '제법인데?', '오~ 이 정도면 인정.'],
    okay:  ['정답! 다음엔 조금만 더 빨리 가 보자.', '맞았어. 속도만 붙으면 무섭겠는데?', '좋아, 정확해. 이제 스피드!'],
    close: ['아슬아슬 세이프!', '휴, 시간 다 갈 뻔했다!', '간신히 통과~ 그래도 정답은 정답!']
  };
  function rightLine(sec) {
    const remain = 1 - sec / settings.limit;
    if (sec <= 3) return pick(RIGHT.blitz);
    if (remain <= .2) return pick(RIGHT.close);
    if (sec <= 6) return pick(RIGHT.quick);
    return pick(RIGHT.okay);
  }
  const TAUNTS = [
    { min: 1,  face: 'shock', lines: ['전부 다? 제법인데? 제한 시간 줄여도 되겠어.', '오호, 좀 하는군! 5초짜리도 버틸 수 있나 볼까?'] },
    { min: .8, face: 'smug',  lines: ['아깝다~ 딱 그만큼이 너의 한계인 거야?', '다 맞히는 건 아직 무리인가 보네~'] },
    { min: .5, face: 'smug',  lines: ['반타작 실력. 거리 구하다가 소금물에 빠진 거 아니지?', '절반은 알고 절반은 찍었지? 다 보여.'] },
    { min: .2, face: 'yawn',  lines: ['음… 오늘 컨디션 탓으로 해 줄게. 딱 한 번만.', '나누기랑 곱하기가 사이가 안 좋나 봐. 너랑.'] },
    { min: 0,  face: 'yawn',  lines: ['타일 아무거나 눌렀지? 다 티 났어.', '소금물보다 싱겁다. 농도 0%.'] }
  ];

  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // 서로 맞는 값 세트 (모든 양을 채워 방해 단어도 값이 있게)
  function valueSet() {
    const v = rnd(2, 20), t = rnd(2, 12), b = rnd(10, 60) * 10, c = rnd(2, 30);
    return { '빠르기': v, '걸린 시간': t, '간 거리': v * t, '소금물의 양': b, '농도': c, '진하기': c / 100, '소금의 양': b * c / 100 };
  }

  // 토큰 → 값. ×÷ 먼저, +− 나중, 같은 급은 왼쪽부터. 형식이 틀리면 null.
  function evaluate(tokens, vals) {
    if (tokens.length === 0 || tokens.length % 2 === 0) return null;
    for (let i = 0; i < tokens.length; i++) if ((i % 2 === 0) !== (tokens[i].kind !== 'op')) return null;
    const num = tk => tk.kind === 'num' ? tk.value : vals[tk.label];
    const terms = [], signs = [];
    let cur = num(tokens[0]);
    for (let i = 1; i < tokens.length; i += 2) {
      const op = tokens[i].label, nx = num(tokens[i + 1]);
      if (op === '×') cur *= nx; else if (op === '÷') cur /= nx; else { terms.push(cur); signs.push(op); cur = nx; }
    }
    terms.push(cur);
    return signs.reduce((acc, s, i) => s === '+' ? acc + terms[i + 1] : acc - terms[i + 1], terms[0]);
  }
  function isCorrect(tokens, target) {
    for (let k = 0; k < 3; k++) {
      const vals = valueSet(), got = evaluate(tokens, vals);
      if (got === null || !isFinite(got)) return false;
      if (Math.abs(got - vals[target]) > 1e-9 * Math.max(1, Math.abs(vals[target]))) return false;
    }
    return true;
  }

  // 타일: 주어진 두 양 + 다른 계열 방해 단어 1개 + 연산자 4개 + (소금물이면 항상, 빠르기면 절반 확률로) 100
  function buildTiles(p) {
    const words = p.given.slice();
    if (p.fam === 'speed') words.push(pick(['소금의 양', '소금물의 양', settings.salt === 'mixed' ? pick(['진하기', '농도']) : '진하기']));
    else words.push(pick(SPEED));
    const tiles = words.map(l => ({ kind: 'var', label: l }))
      .concat(['×', '÷', '+', '−'].map(o => ({ kind: 'op', label: o })));
    if (p.fam !== 'speed' || Math.random() < .5) tiles.push({ kind: 'num', label: '100', value: 100 });
    return shuffle(tiles).map((t, i) => ({ ...t, id: i }));
  }

  // ── 설정 ──
  const DEFAULTS = { count: 10, limit: 20, salt: 'ratio' };
  let settings = { ...DEFAULTS };
  try { const s = JSON.parse(localStorage.getItem('relgame-settings') || 'null'); if (s) settings = { ...DEFAULTS, ...s }; } catch (e) {}
  const NOTES = {
    ratio: '<b>진하기</b> = 소금의 양 ÷ 소금물의 양 으로만 나와. 100은 함정으로 섞여 있어.',
    mixed: '<b>진하기</b>(소금 ÷ 소금물)와 <b>농도</b>(진하기 × 100, %)가 섞여 나와. 100을 언제 쓰는지 가려야 해.'
  };
  function paintSettings() {
    document.querySelectorAll('.chips').forEach(g => {
      const key = g.dataset.key;
      g.querySelectorAll('.chip').forEach(c => {
        const on = String(settings[key]) === c.dataset.v;
        c.setAttribute('aria-checked', on); c.tabIndex = on ? 0 : -1;
      });
    });
    $('saltNote').innerHTML = NOTES[settings.salt];
  }
  document.querySelectorAll('.chips').forEach(g => {
    g.addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      const key = g.dataset.key; settings[key] = key === 'salt' ? c.dataset.v : Number(c.dataset.v);
      try { localStorage.setItem('relgame-settings', JSON.stringify(settings)); } catch (err) {}
      paintSettings();
    });
  });

  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('show', s.id === id)); }

  // ── 출제 순서: 풀을 섞어 돌리고, 같은 문제가 연달아 나오지 않게 ──
  let pool = [], queue = [], last = null;
  function nextProblem() {
    if (queue.length === 0) {
      queue = shuffle(pool);
      if (last && queue[0].id === last.id) queue.push(queue.shift());
    }
    last = queue.shift();
    return last;
  }

  // ── 플레이 ──
  let n, score, streak, prob, tiles, picked, locked, stats, wrongs, okTimes;
  let startAt = 0, leftMs = 0, raf = 0;

  function render() {
    const bank = $('bank'), ans = $('answer');
    bank.innerHTML = ''; ans.innerHTML = '';
    tiles.forEach(t => {
      const used = picked.includes(t.id);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tile ' + t.kind + (used ? ' used' : ''); b.textContent = t.label;
      if (used) { b.setAttribute('aria-hidden', 'true'); b.tabIndex = -1; }
      b.addEventListener('click', () => { if (!locked) { picked.push(t.id); render(); } });
      bank.appendChild(b);
    });
    if (picked.length === 0) {
      const h = document.createElement('div'); h.className = 'hint'; h.textContent = '아래 타일을 눌러 식을 만들어 봐'; ans.appendChild(h);
    }
    picked.forEach(id => {
      const t = tiles[id], b = document.createElement('button');
      b.type = 'button'; b.className = 'tile ' + t.kind; b.textContent = t.label; b.setAttribute('aria-label', t.label + ' 빼기');
      b.addEventListener('click', () => { if (!locked) { picked = picked.filter(x => x !== id); render(); } });
      ans.appendChild(b);
    });
    $('check').disabled = picked.length === 0 || locked;
  }

  function startProblem() {
    n++; prob = nextProblem(); tiles = buildTiles(prob); picked = []; locked = false;
    $('play').classList.remove('locked');
    $('counter').textContent = n + '/' + settings.count;
    const f = $('family'); f.textContent = FAM_LABEL[prob.fam]; f.className = 'family ' + FAM_CLASS[prob.fam];
    $('targetWord').textContent = prob.target;
    $('bubble').textContent = pick(BUBBLES);
    render();
    leftMs = settings.limit * 1000; resume();
  }

  function resume() { startAt = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
  function pause() { cancelAnimationFrame(raf); leftMs = Math.max(0, leftMs - (performance.now() - startAt)); }
  function tick(now) {
    const left = Math.max(0, leftMs - (now - startAt)), r = left / (settings.limit * 1000), fill = $('timefill');
    fill.style.width = (r * 100) + '%';
    fill.classList.toggle('warn', r <= .3 && r > .15);
    fill.classList.toggle('danger', r <= .15);
    if (left <= 0) { judge(true); return; }
    raf = requestAnimationFrame(tick);
  }

  function judge(timeout) {
    pause(); locked = true; $('play').classList.add('locked'); $('check').disabled = true;
    const ok = !timeout && isCorrect(picked.map(id => tiles[id]), prob.target);
    stats[prob.fam][1]++;
    const sec = (settings.limit * 1000 - leftMs) / 1000;
    if (ok) { score++; streak++; stats[prob.fam][0]++; okTimes.push(sec); }
    else { streak = 0; wrongs.push(prob); }
    const s = $('streak'); s.textContent = streak + '연속!'; s.classList.toggle('on', streak >= 3);

    $('sheet').className = 'sheet show ' + (ok ? 'good' : 'bad');
    $('sheetBadge').textContent = ok ? '✓' : '✕';
    $('sheetText').textContent = ok ? '정답!' : (timeout ? '시간 초과' : '오답');
    $('sheetBody').textContent = ok
      ? rightLine(sec) + ' (' + sec.toFixed(1) + '초)' + (streak >= 3 ? ' · ' + streak + '연속이라니, 제법 무서운데?' : '')
      : '정답: ' + prob.target + ' = ' + prob.answer;
    const nx = $('next'); nx.className = 'btn' + (ok ? '' : ' red'); nx.textContent = n >= settings.count ? '결과 보기' : '계속';
    if (!ok) { const a = $('answer'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }
    setTimeout(() => nx.focus(), 260);
  }

  function showEnd() {
    const total = settings.count, ratio = score / total, tier = TAUNTS.find(t => ratio >= t.min);
    $('endMascot').innerHTML = '<use href="#mascot-' + tier.face + '"/>';
    $('score').innerHTML = score + '<small> / ' + total + '</small>';
    $('taunt').textContent = (ratio === 1 && settings.limit === 5)
      ? pick(['5초짜리를 전부 다? 이렇게 빨리? 인정!', '5초 모드 만점이라니… 오호, 진짜 좀 하는군.'])
      : pick(tier.lines);
    $('fact').textContent = ['speed', 'ratio', 'pct'].filter(k => stats[k][1]).map(k => STAT_LABEL[k] + ' ' + stats[k][0] + '/' + stats[k][1]).join(' · ')
      + (okTimes.length ? ' · 정답 평균 ' + (okTimes.reduce((a, b) => a + b, 0) / okTimes.length).toFixed(1) + '초' : '');
    const w = $('wrongs');
    if (wrongs.length === 0) w.innerHTML = '<div class="clean">틀린 문제 없음</div>';
    else {
      const seen = new Set(), items = wrongs.filter(p => !seen.has(p.id) && seen.add(p.id));
      w.innerHTML = '<h3>틀린 식 다시 보기</h3><ul>' + items.map(p => '<li><b>' + p.target + '</b> = ' + p.answer + '</li>').join('') + '</ul>';
    }
    show('end');
  }

  function newRound() {
    pool = PROBLEMS.filter(p => p.fam === 'speed' || p.fam === 'ratio' || (settings.salt === 'mixed' && p.fam === 'pct'));
    queue = []; last = null; n = 0; score = 0; streak = 0; wrongs = []; okTimes = [];
    stats = { speed: [0, 0], ratio: [0, 0], pct: [0, 0] };
    $('streak').classList.remove('on'); $('sheet').className = 'sheet'; $('quitModal').classList.remove('show');
    show('play'); startProblem();
  }

  $('start').addEventListener('click', newRound);
  $('check').addEventListener('click', () => judge(false));
  $('next').addEventListener('click', () => { $('sheet').className = 'sheet'; if (n >= settings.count) showEnd(); else startProblem(); });
  $('again').addEventListener('click', newRound);
  $('toHome').addEventListener('click', () => { paintSettings(); show('home'); });
  $('quit').addEventListener('click', () => { if (!locked) pause(); $('quitModal').classList.add('show'); $('stay').focus(); });
  $('stay').addEventListener('click', () => { $('quitModal').classList.remove('show'); if (!locked) resume(); });
  $('leave').addEventListener('click', () => { cancelAnimationFrame(raf); $('quitModal').classList.remove('show'); $('sheet').className = 'sheet'; paintSettings(); show('home'); });

  paintSettings();
})();
</script>
</body>
</html>
